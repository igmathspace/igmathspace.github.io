<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f5f6fa; color: #333; }

  .header { background: #1a237e; color: white; text-align: center; padding: 30px 20px; }
  .header h1 { margin: 0; font-size: 30px; letter-spacing: 1px; }
  .header p { margin: 10px 0 0; color: #ffd54f; font-size: 17px; font-weight: bold; }

  .wrap { max-width: 1200px; margin: 30px auto; padding: 0 16px; }

  /* Tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab-btn {
    background: #e8eaf6; color: #1a237e; border: none; border-radius: 10px 10px 0 0;
    padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.05);
  }
  .tab-btn small { display: block; font-weight: 400; color: #5c6bc0; font-size: 12px; }
  .tab-btn:hover { background: #c5cae9; }
  .tab-btn.active { background: #1a237e; color: white; }
  .tab-btn.active small { color: #ffd54f; }

  .panel {
    display: none; background: white; border-radius: 0 12px 12px 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #ff6f00; padding: 24px;
  }
  .panel.active { display: block; }
  .panel h2 { margin: 0 0 6px; color: #1a237e; font-size: 20px; }
  .panel .meta { color: #555; font-size: 14px; margin-bottom: 14px; }
  .panel .count { color: #ff6f00; font-weight: bold; }

  .panel-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .pdf-btn {
    background: #ff6f00; color: white; border: none; border-radius: 25px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 3px 8px rgba(255,111,0,0.3);
  }
  .pdf-btn:hover { background: #e65100; }

  /* Search */
  .search { flex: 1; min-width: 220px; padding: 10px 12px; border: 1px solid #c5cae9; border-radius: 8px; font-size: 14px; }
  .search:focus { outline: none; border-color: #1a237e; box-shadow: 0 0 0 3px rgba(26,35,126,0.12); }

  /* Table (screen) */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #1a237e; color: white; text-align: left; padding: 10px; font-size: 13px; }
  td { padding: 9px 10px; border-bottom: 1px solid #e0e3ef; }
  tbody tr:nth-child(even) { background: #f7f8fc; }
  tbody tr:hover { background: #fff3e0; }
  td.num { text-align: center; color: #555; width: 50px; }
  td.code { font-weight: bold; color: #1a237e; text-align: center; width: 90px; }
  td.roll { font-family: 'Courier New', monospace; white-space: nowrap; }
  td.reg  { font-family: 'Courier New', monospace; color: #666; white-space: nowrap; }
  td.name { font-weight: 600; }
  .prog-sep td { background: #e8eaf6; color: #1a237e; font-weight: bold; padding: 7px 10px; }

  /* Footer */
  .footer { background: #1a237e; color: #9fa8da; text-align: center; padding: 20px; font-size: 14px; margin-top: 40px; }
  .footer p { margin: 4px 0; }
  .footer strong { color: #ffd54f; }

  /* Print sheet: hidden on screen, used only by the print dialog */
  #print-area { display: none; }

  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #ffffff; }
    /* hide the whole page, show only the print sheet */
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; color: #000000; font-family: Arial, sans-serif; }
    #print-area .ps-title { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 2px; }
    #print-area .ps-sub { text-align: center; font-size: 12px; margin-bottom: 8px; }
    #print-area .ps-course { text-align: center; font-size: 13px; font-weight: bold; margin-bottom: 2px; }
    #print-area .ps-count { text-align: center; font-size: 11px; margin-bottom: 10px; }
    #print-area table { width: 100%; border-collapse: collapse; font-size: 11px; }
    #print-area th, #print-area td { border: 1px solid #000000; padding: 5px 6px; color: #000000; background: #ffffff; text-align: left; }
    #print-area th { font-weight: bold; }
    #print-area td.num, #print-area td.code { text-align: center; }
    #print-area td.roll, #print-area td.reg { font-family: 'Courier New', monospace; }
    #print-area tr.prog-sep td { background: #e6e6e6; font-weight: bold; }
    #print-area tr { page-break-inside: avoid; }
    #print-area thead { display: table-header-group; }
  }

  @media (max-width: 600px) { .header h1 { font-size: 22px; } }
</style>

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* Builds the table rows (used on screen and in the print sheet) */
  function buildRows(students) {
    let rows = '';
    let lastProg = null;
    let sl = 0;
    students.forEach(s => {
      if (s.pcode !== lastProg) {
        lastProg = s.pcode;
        rows += `<tr class="prog-sep"><td colspan="5">${esc(s.pcode)} · ${esc(PROGRAMMES[s.pcode])}</td></tr>`;
      }
      sl++;
      rows += `<tr>
        <td class="num">${sl}</td>
        <td class="code">${esc(s.pcode)}</td>
        <td class="roll">${esc(s.roll)}</td>
        <td class="reg">${s.reg ? esc(s.reg) : '—'}</td>
        <td class="name">${esc(s.name)}</td>
      </tr>`;
    });
    return rows;
  }

  function buildTabs() {
    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');

    COURSES.forEach((course, idx) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
      btn.innerHTML = `${esc(course.code)}<small>${esc(course.title)} (${course.students.length})</small>`;
      btn.onclick = () => showTab(idx);
      tabs.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'panel' + (idx === 0 ? ' active' : '');
      panel.id = 'panel-' + idx;
      panel.innerHTML = `
        <h2>${esc(course.code)} · ${esc(course.title)}</h2>
        <div class="meta">Total students: <span class="count">${course.students.length}</span></div>
        <div class="panel-actions">
          <input type="text" class="search" placeholder="Search by name or roll number…" oninput="filterTable(${idx}, this.value)">
          <button class="pdf-btn" onclick="printTab(${idx})">🖨 Print / Save as PDF (A4)</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Sl No</th>
                <th>Prog Code</th>
                <th>Roll No</th>
                <th>Reg No</th>
                <th>Student Name</th>
              </tr>
            </thead>
            <tbody id="tbody-${idx}">${buildRows(course.students)}</tbody>
          </table>
        </div>`;
      panels.appendChild(panel);
    });
  }

  function showTab(idx) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  }

  /* Live search inside a tab */
  function filterTable(idx, q) {
    q = q.trim().toLowerCase();
    const tbody = document.getElementById('tbody-' + idx);
    let currentSep = null, sepHasMatch = false;
    Array.from(tbody.rows).forEach(row => {
      if (row.classList.contains('prog-sep')) {
        if (currentSep) currentSep.style.display = sepHasMatch ? '' : 'none';
        currentSep = row; sepHasMatch = false;
        return;
      }
      const match = q === '' || row.textContent.toLowerCase().includes(q);
      row.style.display = match ? '' : 'none';
      if (match) sepHasMatch = true;
    });
    if (currentSep) currentSep.style.display = sepHasMatch ? '' : 'none';
  }

  /* Fill the print sheet for one tab and open the print dialog.
     In the dialog, choose "Save as PDF" as the destination to save a PDF. */
  function printTab(idx) {
    const course = COURSES[idx];
    const area = document.getElementById('print-area');
    area.innerHTML = `
      <div class="ps-title">NAM COLLEGE KALLIKKANDY</div>
      <div class="ps-sub">Fifth Semester · SEC Course Student List</div>
      <div class="ps-course">${esc(course.code)} · ${esc(course.title)}</div>
      <div class="ps-count">Total students: ${course.students.length}</div>
      <table>
        <thead>
          <tr>
            <th style="width:50px;text-align:center;">Sl No</th>
            <th style="width:80px;text-align:center;">Prog Code</th>
            <th>Roll No</th>
            <th>Reg No</th>
            <th>Student Name</th>
          </tr>
        </thead>
        <tbody>${buildRows(course.students)}</tbody>
      </table>`;
    window.onafterprint = () => { area.innerHTML = ''; window.onafterprint = null; };
    window.print();
  }

  buildTabs();
</script>

</body>
</html>
