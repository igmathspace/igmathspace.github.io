<title>Exam Schedule - NAM College Kallikkandy</title>
<style>
  :root {
    --blue: #6BA3D4;
    --blue-dark: #3F7FB0;
    --blue-soft: #DCEBF7;
    --teal: #5AACA8;
    --red: #C41E3A;
    --ivory: #FFFDF5;
    --ink: #000000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--teal);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.45;
  }
  header.site-head {
    background: var(--blue);
    padding: 12px 12px 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }
  .banner {
    display: block;
    width: 24cm;
    max-width: 100%;
    aspect-ratio: 6 / 1;
    object-fit: fill;
    margin: 0 auto;
  }
  .site-head .back {
    display: block;
    text-align: center;
    margin-top: 8px;
    font-size: 0.9rem;
    color: #000;
    text-decoration: none;
    font-weight: bold;
  }
  .site-head .back:hover { text-decoration: underline; }

  main { max-width: 1000px; margin: 22px auto 30px; padding: 0 12px; }
  .card {
    background: var(--ivory);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
  }
  .table-wrap { overflow-x: auto; }
  table.exam {
    width: 100%;
    border-collapse: collapse;
    min-width: 560px;
  }
  table.exam th, table.exam td {
    border: 1.5px solid #4a4a4a;
    padding: 10px 12px;
    vertical-align: middle;
  }
  table.exam td.title-cell {
    text-align: center;
    background: var(--ivory);
    color: var(--red);
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  td.t1 { font-size: 1.45rem; padding-top: 14px; }
  td.t2 { font-size: 1.15rem; }
  td.t3 { font-size: 1.1rem; padding-bottom: 14px; }
  table.exam thead th.colhead {
    background: var(--blue-dark);
    color: #fff;
    font-size: 1.05rem;
    letter-spacing: 0.4px;
  }
  td.date-cell {
    background: var(--blue-soft);
    width: 160px;
    text-align: center;
    font-weight: bold;
  }
  td.date-cell small { display: block; font-weight: normal; color: #333; margin-top: 2px; }
  td.paper-cell { background: #fff; font-size: 1rem; }
  td.paper-cell .code { color: #444; white-space: nowrap; }
  td.btn-cell { background: #fff; width: 150px; text-align: center; }
  tbody tr.day-start td { border-top: 3px solid var(--blue-dark); }
  tbody tr:hover td.paper-cell, tbody tr:hover td.btn-cell { background: #F2F8FD; }

  button.list-btn {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(#8EC2EC, #4F8FBF);
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    box-shadow: 0 4px 0 #36688F, 0 6px 10px rgba(0,0,0,0.3);
    transition: transform 0.08s, box-shadow 0.08s;
    white-space: nowrap;
  }
  button.list-btn:hover { background: linear-gradient(#9DCBF2, #5A9BCB); }
  button.list-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #36688F, 0 2px 4px rgba(0,0,0,0.3);
  }
  button.list-btn[disabled] { opacity: 0.6; cursor: wait; }

  .note { text-align: center; font-size: 0.85rem; color: #333; margin: 10px 0 0; font-style: italic; }

  footer.site-foot {
    background: var(--blue);
    text-align: center;
    padding: 14px 10px;
    font-weight: bold;
    box-shadow: 0 -3px 8px rgba(0,0,0,0.2);
  }
  footer.site-foot small { display: block; font-weight: normal; margin-top: 2px; }

  @media (max-width: 640px) {
    td.t1 { font-size: 1.15rem; }
    td.t2, td.t3 { font-size: 1rem; }
    table.exam th, table.exam td { padding: 8px; }
    td.date-cell { width: 110px; }
    td.btn-cell { width: 120px; }
    button.list-btn { padding: 7px 12px; font-size: 0.85rem; }
  }
</style>
</head>

const COUNT_HEADS = ['English', 'History', 'CS', 'MATHS', 'PC', 'Commerce', 'BBA'];
const FOOTER_TEXT = 'Gafoor I , FYUGP Coordinator';

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function parseDate(iso) {
  const p = iso.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function fmtDate(iso) {
  const d = parseDate(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function weekday(iso) { return DAYS[parseDate(iso).getDay()]; }
function sessionTime(t) { return t.replace(/^0/, '').replace(/^(\d+):(\d+) (AM|PM)$/, '$1:$2 $3'); }
function paperTitle(e) { return e.name + ' (' + e.code + ')'; }

/* ---------- Page table ---------- */
function buildPage() {
  const body = document.getElementById('examBody');
  const byDate = new Map();
  DATA.exams.forEach((e, i) => {
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(i);
  });
  byDate.forEach((list, date) => {
    list.forEach((examIndex, k) => {
      const e = DATA.exams[examIndex];
      const tr = document.createElement('tr');
      if (k === 0) tr.className = 'day-start';

      if (k === 0) {
        const td = document.createElement('td');
        td.className = 'date-cell';
        td.rowSpan = list.length;
        td.textContent = fmtDate(date);
        const small = document.createElement('small');
        small.textContent = weekday(date) + ' | ' + sessionTime(e.time);
        td.appendChild(small);
        tr.appendChild(td);
      }

      const paper = document.createElement('td');
      paper.className = 'paper-cell';
      paper.appendChild(document.createTextNode(e.name + ' '));
      const code = document.createElement('span');
      code.className = 'code';
      code.textContent = '(' + e.code + ')';
      paper.appendChild(code);
      tr.appendChild(paper);

      const btnCell = document.createElement('td');
      btnCell.className = 'btn-cell';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'list-btn';
      btn.textContent = 'Student list';
      btn.title = e.s.length + ' students';
      btn.addEventListener('click', () => printList(examIndex, btn));
      btnCell.appendChild(btn);
      tr.appendChild(btnCell);

      body.appendChild(tr);
    });
  });
}

  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const PW = 210, PH = 297, M = 12, FOOT = 16;
  const BLUE = [107, 163, 212], BLUE_D = [47, 102, 144], SOFT = [238, 245, 251], RED = [196, 30, 58], LINE = [183, 204, 224];

  /* heading band */
  doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]);
  doc.rect(0, 0, PW, 31, 'F');
  doc.setFillColor(RED[0], RED[1], RED[2]);
  doc.rect(0, 31, PW, 1.3, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('NAM COLLEGE KALLIKKANDY', PW / 2, 12.5, { align: 'center' });
  doc.setFontSize(11);
  doc.text('III SEMESTER FYUGP (2025)', PW / 2, 19.5, { align: 'center' });
  doc.text('EXAMINATION NOVEMBER 2026', PW / 2, 25.5, { align: 'center' });

  /* title */
  doc.setTextColor(RED[0], RED[1], RED[2]);
  doc.setFontSize(14);
  doc.text('STUDENT LIST', PW / 2, 42, { align: 'center' });

  /* paper information box */
  const leftW = 118;
  doc.setFontSize(10.5);
  doc.setFont('helvetica', 'bold');
  const paperLines = doc.splitTextToSize(paperTitle(e), leftW - 6);
  const boxH = Math.max(25, 9 + paperLines.length * 5 + 3);
  const boxY = 47;
  doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
  doc.setFillColor(243, 248, 252);
  doc.roundedRect(M, boxY, PW - 2 * M, boxH, 2, 2, 'FD');
  doc.setDrawColor(BLUE[0], BLUE[1], BLUE[2]);
  doc.line(M + leftW, boxY + 3, M + leftW, boxY + boxH - 3);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(90, 90, 90);
  doc.text('EXAM PAPER', M + 3, boxY + 5.5);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(0, 0, 0);
  doc.text(paperLines, M + 3, boxY + 11);

  const rx = M + leftW + 5;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(90, 90, 90);
  doc.text('DATE & SESSION', rx, boxY + 5.5);
  doc.text('STUDENTS', rx, boxY + 14.5);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(0, 0, 0);
  doc.text(fmtDate(e.date) + ' (' + weekday(e.date) + '), ' + sessionTime(e.time), rx, boxY + 10.5);
  doc.text(String(e.s.length), rx, boxY + 19.5);

  /* student list table */
  const rows = e.s.map(i => DATA.students[i])
    .sort((a, b) => (a[2] - b[2]) || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
    .map((s, n) => [n + 1, s[0], s[1], DATA.progs[s[2]]]);

  const title = paperTitle(e);
  doc.autoTable({
    startY: boxY + boxH + 6,
    head: [['Sl No', 'Register Number', 'Name', 'Department (Programme of Study)']],
    body: rows,
    theme: 'grid',
    margin: { top: 16, left: M, right: M, bottom: FOOT + 2 },
    styles: { font: 'helvetica', fontSize: 9.5, cellPadding: { top: 1.9, bottom: 1.9, left: 2.5, right: 2.5 },
              lineColor: LINE, lineWidth: 0.25, textColor: [0, 0, 0], valign: 'middle' },
    headStyles: { fillColor: BLUE_D, textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center', fontSize: 9.5 },
    alternateRowStyles: { fillColor: SOFT },
    columnStyles: {
      0: { cellWidth: 14, halign: 'center' },
      1: { cellWidth: 38, halign: 'center', fontStyle: 'bold' },
      2: { cellWidth: 70, halign: 'left' },
      3: { cellWidth: 64, halign: 'left' }
    },
    didDrawPage: function (d) {
      if (d.pageNumber > 1) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(90, 90, 90);
        const t = doc.splitTextToSize('NAM College Kallikkandy | III Sem FYUGP | Exam Nov 2026 | ' + title, PW - 2 * M)[0];
        doc.text(t, M, 9);
        doc.setDrawColor(BLUE[0], BLUE[1], BLUE[2]);
        doc.setLineWidth(0.4);
        doc.line(M, 11, PW - M, 11);
      }
    }
  });

  /* student count table */
  let y = doc.lastAutoTable.finalY + 10;
  if (y + 46 > PH - FOOT) { doc.addPage(); y = 20; }
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(RED[0], RED[1], RED[2]);
  doc.text('Student Count', M, y);
  doc.setDrawColor(RED[0], RED[1], RED[2]);
  doc.setLineWidth(0.5);
  doc.line(M, y + 1.6, M + 34, y + 1.6);

  const counts = DATA.progs.map(() => 0);
  e.s.forEach(i => counts[DATA.students[i][2]]++);
  const total = counts.reduce((a, b) => a + b, 0);
  const cwidths = [15, 15, 11, 15, 11, 19, 12];   /* English, History, CS, MATHS, PC, Commerce, BBA */
  const cstyles = { 0: { cellWidth: 13, halign: 'center' }, 1: { cellWidth: 57, halign: 'left' } };
  for (let c = 0; c < 7; c++) cstyles[2 + c] = { cellWidth: cwidths[c], halign: 'center' };
  cstyles[9] = { cellWidth: 18, halign: 'center', fontStyle: 'bold', fillColor: [220, 235, 247] };
  doc.autoTable({
    startY: y + 5,
    head: [['Sl No', 'Course with code'].concat(COUNT_HEADS, ['Total'])],
    body: [[1, title].concat(counts, [total])],
    theme: 'grid',
    margin: { top: 16, left: M, right: M, bottom: FOOT + 2 },
    styles: { font: 'helvetica', fontSize: 9, cellPadding: { top: 2.4, bottom: 2.4, left: 1.5, right: 1.5 }, lineColor: LINE, lineWidth: 0.25,
              textColor: [0, 0, 0], valign: 'middle' },
    headStyles: { fillColor: BLUE_D, textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center', fontSize: 8 },
    columnStyles: cstyles,
    rowPageBreak: 'avoid'
  });

  /* footer on every page */
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setDrawColor(BLUE[0], BLUE[1], BLUE[2]);
    doc.setLineWidth(0.6);
    doc.line(M, PH - 13, PW - M, PH - 13);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    doc.setTextColor(90, 90, 90);
    doc.text('Page ' + p + ' of ' + pages, M, PH - 8);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.setTextColor(0, 0, 0);
    doc.text(FOOTER_TEXT, PW - M, PH - 8, { align: 'right' });
  }
  return doc;
}

function printList(examIndex, btn) {
  if (!(window.jspdf && window.jspdf.jsPDF) || typeof (new window.jspdf.jsPDF()).autoTable !== 'function') {
    alert('The PDF library could not be loaded. Please check your internet connection and try again.');
    return;
  }
  if (btn) btn.disabled = true;
  try {
    const e = DATA.exams[examIndex];
    const doc = buildPdf(examIndex);
    doc.save('Student_List_' + e.code + '_' + e.date + '.pdf');
  } finally {
    if (btn) btn.disabled = false;
  }
}

buildPage();
</script>
</body>
</html>
