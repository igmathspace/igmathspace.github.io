<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Online Evaluation Test – LaTeX</title>

<style>

#timer.warn{background:#ffe3d6;border-color:#7a1a0a;color:#7a1a0a}
</style></head><body>
<header>
<h1>NAM COLLEGE KALLIKKANDY</h1><h2>DEPARTMENT OF MATHEMATICS</h2><h2>ONLINE EVALUATION TEST</h2>
<h3>LaTeX – Getting Started, Document Formatting, Tables &amp; Figures and Math Mode</h3>
</header>
<main>
<p class="note">(Attend all questions)</p>

<section id="s1" class="on"><div class="center"><button id="start">Start</button></div></section>

</div>
</section>

</main>
<footer>© Gafoor I (<a href="mailto:gafoorbabuitwo@gmail.com">gafoorbabuitwo@gmail.com</a>)</footer>

<script>
/* ===== SETTINGS ===== */
const API="https://script.google.com/macros/s/AKfycby_Cds-L6yh_4s_E3WKl8HwImbeSw6pqOKMaAbyoR7vRpkNA85H2fzM8PMnz-xEqWu4/exec";   // Google Apps Script web app URL (Step 4 of the guide)
const STORE_KEY="latex_mcq_done";          // browser flag: this device already attempted
const LIMIT=1800;                          // time limit in seconds (1800 = 30 minutes)

const MODULES=[[1,25],[26,50],[51,75],[76,100]];

/* ===== STUDENT LIST: roll|name, one per line ===== */
const P=t=>t.trim().split("\n").map(l=>l.split("|"));
const ROLLS=P(`NM24MATR002|FARHANA UNNIYATHAM KANDIYIL

/* ===== QUESTION BANK =====
   line n = question n.  Fields are separated by ¦  :  question ¦ A ¦ B ¦ C ¦ D

const QB=String.raw`Which document class is used for a basic LaTeX article?¦§book§¦§article§¦§report§¦§memoir§

Which command sets the page style?¦§\pagestyle{}§¦§\pagenumbering{}§¦§\style{}§¦§\pageformat{}§
What does §\thispagestyle{empty}§ do?¦Removes page number from current page¦Removes all content from current page¦Creates an empty page¦Sets page style to empty for all pages

Which command adds a caption to a figure?¦§\caption{}§¦§\title{}§¦§\label{}§¦§\figcaption{}§

Which command is used to resize an image?¦§\includegraphics[width=5cm]{image}§¦§\resize{image}§¦§\scale{image}§¦§\size{image}§
Which command is used to rotate an image?¦§\includegraphics[angle=45]{image}§¦§\rotate{image}§¦§\rot{image}§¦§\turn{image}§
What is the correct way to create a table with 3 columns?¦§\begin{tabular}{ccc}§¦§\begin{tabular}{3c}§¦§\begin{tabular}{c c c}§¦Both A and C

Which command is used for Greek letter alpha?¦§\alpha§¦§\Alpha§¦§\ga§¦§\greek{a}§

Which command is used for integral symbol?¦§\int§¦§\integral§¦§\sum§¦§\integ§
Which command is used for fractions?¦§\frac{}{}§¦§\fraction{}{}§¦§\div{}{}§¦§\over{}{}§
Which environment aligns equations at the equals sign?¦§align§¦§equation§¦§eqnarray§¦Both A and C
What does §align*§ do differently from §align§?¦No equation numbers¦No alignment¦No math mode¦No line breaks
Which environment is used for matrices with brackets?¦§bmatrix§¦§pmatrix§¦§matrix§¦§vmatrix§
Which environment is used for matrices with parentheses?¦§bmatrix§¦§pmatrix§¦§matrix§¦§vmatrix§
Which package is required for matrix environments?¦§amsmath§¦§matrix§¦§mathtools§¦Both A and C
Which package is used for theorems and proofs?¦§amsthm§¦§theorem§¦§proof§¦§maththm§
Which environment is used for a theorem?¦§theorem§¦§thm§¦§proof§¦§lemma§
Which environment is used for a proof?¦§proof§¦§theorem§¦§lemma§¦§demonstration§
Which command is used for a square root?¦§\sqrt{}§¦§\root{}§¦§\sq{}§¦§\radical{}§
Which command is used for a superscript?¦§^§¦§_§¦§~§¦§'§
Which command is used for a subscript?¦§^§¦§_§¦§~§¦§'§
Which command is used for infinity symbol?¦§\infty§¦§\inf§¦§\infinite§¦§\infinity§
Which command is used for partial derivative?¦§\partial§¦§\derivative§¦§\diff§¦§\pd§
Which command is used for nabla (gradient)?¦§\nabla§¦§\grad§¦§\del§¦§\gradient§
Which command is used for limits?¦§\lim§¦§\limit§¦§\lims§¦§\l§
Which command is used for a vector?¦§\vec{}§¦§\vector{}§¦§\arrow{}§¦§\v{}§
Which command is used for a hat symbol in math mode?¦§\hat{}§¦§\cap{}§¦§\header{}§¦§\top{}§`.trim().split("\n").map(l=>l.split("¦"));
if(QB.length!==100||QB.some(q=>q.length!==5))console.error("Question bank problem: expected 100 lines with 5 fields each");

/* ===== HELPERS ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>t.split("§").map((s,i)=>i%2?"<code>"+esc(s)+"</code>":esc(s)).join("");
const show=id=>{["s1","s2","s3","s4"].forEach(s=>$(s).classList.toggle("on",s==id));window.scrollTo(0,0)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const post=async o=>(await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)})).json();
/* options such as "Both A and B" or "All of the above" must keep their order */
const fixedOrder=q=>q.slice(1).some(o=>/\b(both|all of the above)\b/i.test(o));
let taken=[],paper=[],busy=false,sending=false,tmr=null;
const done=()=>localStorage.getItem(STORE_KEY)||"";

/* ===== SCREEN 1 -> 2 ===== */
function fillRolls(){
  $("roll").innerHTML='<option value="">— Select Roll Number —</option>'+ROLLS.map(([n])=>{
    const t=taken.includes(n);
    return `<option value="${n}"${t?" disabled":""}>${n}${t?" (already attempted)":""}</option>`}).join("");
  $("nm").value="";$("begin").disabled=true;
}
$("start").onclick=async()=>{
  show("s2");fillRolls();
  try{taken=(await (await fetch(API)).json()).taken;fillRolls()}catch(e){$("m2").textContent="Could not reach the server. Check your internet and refresh."}
};
$("roll").onchange=()=>{const x=ROLLS.find(([n])=>n==$("roll").value);$("nm").value=x?x[1]:"";$("begin").disabled=!x};

/* ===== SCREEN 2 -> 3 ===== */
$("begin").onclick=async()=>{
  if(busy)return;const roll=$("roll").value,name=$("nm").value;
  if(done()==roll){$("m2").textContent="This roll number has already attempted the test.";return}
  if(!confirm(`Roll No: ${roll}\nName: ${name}\n\nYou can attempt the test only once. Begin now?`))return;
  busy=true;$("begin").disabled=true;$("m2").textContent="Please wait…";
  try{
    const r=await post({action:"start",roll,name});
    if(!r.ok){$("m2").textContent=r.msg;busy=false;return}
  }catch(e){$("m2").textContent="Network error. Try again.";busy=false;$("begin").disabled=false;return}
  busy=false;build(roll,name);
};

function build(roll,name){
  paper=MODULES.flatMap(([a,b])=>shuf(range(a,b)).slice(0,PER_MODULE));
  $("paper").innerHTML=`<div class="card"><b>Roll No:</b> ${esc(roll)} &nbsp;&nbsp; <b>Name:</b> ${esc(name)}</div>`+paper.map((id,i)=>{
    const q=QB[id-1];
    const order=fixedOrder(q)?[0,1,2,3]:shuf([0,1,2,3]);
    return `<div class="card q" id="q${i}"><h4>Question ${i+1}</h4><p>${fmt(q[0])}</p>`+
      order.map((o,k)=>`<label><input type="radio" name="a${i}" value="${"ABCD"[o]}"><span>(${"abcd"[k]}) ${fmt(q[o+1])}</span></label>`).join("")+`</div>`;
  }).join("");
  $("submit").onclick=()=>submit(roll,name);
  window.onbeforeunload=e=>{e.preventDefault();e.returnValue=""};
  show("s3");startTimer(roll,name);
}

/* ===== TIMER: warning 5 min before the limit, answers locked at the limit, auto-submit 5 s later ===== */
function startTimer(roll,name){
  const t0=Date.now(),box=$("timer");let locked=false;box.style.display="block";
  const tick=()=>{
    const s=Math.floor((Date.now()-t0)/1000),left=Math.max(0,LIMIT-s);
    const mm=String(Math.floor(left/60)).padStart(2,"0"),ss=String(left%60).padStart(2,"0");
    if(s<LIMIT-300)box.textContent="Time left: "+mm+":"+ss;
    else if(s<LIMIT){box.className="warn";box.textContent="Warning: only 5 minutes remaining! Time left: "+mm+":"+ss}
    else{
      box.className="warn";box.textContent="Time is over. Answers will be submitted automatically in "+Math.max(0,LIMIT+5-s)+" s";
      if(!locked){locked=true;document.querySelectorAll("#paper input").forEach(i=>i.disabled=true);$("submit").disabled=true}
    }
    if(s>=LIMIT+5){clearInterval(tmr);submit(roll,name,true)}
  };
  tick();tmr=setInterval(tick,500);
}

/* ===== SUBMIT ===== */
async function submit(roll,name,force){
  if(sending)return;
  const ans=paper.map((id,i)=>{const c=document.querySelector(`[name=a${i}]:checked`);return [id,c?c.value:""]});
  document.querySelectorAll(".q").forEach((d,i)=>d.classList.toggle("miss",!ans[i][1]));
  const miss=ans.findIndex(a=>!a[1]);
  if(miss>=0&&!force){$("m3").textContent="Please answer all questions.";$("q"+miss).scrollIntoView({behavior:"smooth",block:"center"});return}
  if(!force&&!confirm("Submit your answers? You cannot change them later."))return;
  sending=true;$("submit").disabled=true;$("m3").textContent="Submitting…";
  try{
    const r=await post({action:"submit",roll,name,ans});
    if(!r.ok)throw new Error(r.msg);
    clearInterval(tmr);localStorage.setItem(STORE_KEY,roll);window.onbeforeunload=null;
    $("done").innerHTML=`Thank you, ${esc(name)}. Your answers have been recorded.<br><b>Score: ${r.total} / ${paper.length}</b>`;show("s4");
  }catch(e){sending=false;$("m3").textContent="Submission failed: "+e.message+(force?" Retrying…":" Press Submit again.");$("submit").disabled=false;if(force)setTimeout(()=>submit(roll,name,true),3000)}
}
</script></body></html>
